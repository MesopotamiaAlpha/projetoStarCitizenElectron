<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Cabeça do Emoto, escalada e centralizada (viewBox original 0 0 64 64 -> escala 3x, offset) -->
  <g transform="translate(32,26) scale(3)">
    <!-- Orelhas / pods laterais -->
    <circle cx="9"  cy="33" r="6.5" fill="#161d2b" stroke="#fbbf24" stroke-width="1.4"/>
    <circle cx="55" cy="33" r="6.5" fill="#161d2b" stroke="#fbbf24" stroke-width="1.4"/>

    <!-- Cúpula da cabeça -->
    <path
      d="M14 31 C14 15, 22 6, 32 6 C42 6, 50 15, 50 31 L50 39 C50 47.5, 42.5 53.5, 32 53.5 C21.5 53.5, 14 47.5, 14 39 Z"
      fill="#0c111c" stroke="#38bdf8" stroke-width="1.6"
    />

    <!-- Reflexo sutil -->
    <path d="M20 16 C23 11, 27 9, 31 8.5" stroke="#38bdf8" stroke-width="1" opacity="0.35" stroke-linecap="round"/>

    <!-- Olhos -->
    <rect x="20.5" y="23" width="8" height="8" rx="1.6" fill="#34d399" filter="url(#glow)"/>
    <rect x="35.5" y="23" width="8" height="8" rx="1.6" fill="#34d399" filter="url(#glow)"/>

    <!-- Placa de queixo -->
    <rect x="23" y="37" width="18" height="11" rx="3.5" fill="#131a28" stroke="#fbbf24" stroke-width="1.2"/>
    <rect x="29.5" y="40.5" width="5" height="4" rx="1" fill="#fbbf24"/>

    <!-- Luz da base -->
    <rect x="26" y="49.5" width="12" height="2.2" rx="1.1" fill="#34d399" opacity="0.85"/>
  </g>
</svg>
